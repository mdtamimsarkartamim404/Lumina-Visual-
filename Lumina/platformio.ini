; ESP32-S3-N16R8 + 3.5" ILI9488 (480x320) PC monitor - LovyanGFX display driver
[platformio]
; Without this, VS Code "Upload" builds+flashes EVERY env below, one after another.
; The LAST one stays on the board (that was the garbled one). Now only esp32s3 is used by default.
default_envs = esp32s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 = 16MB flash (QIO) + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TJpg_Decoder@^1.1.0
    bitbank2/AnimatedGIF@^2.1.1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; DEFAULT: 40 MHz SPI = full-screen video about 10 fps. If the picture gets noisy, use env:esp32s3_20mhz.
[env:esp32s3]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000

; Safe fallback (verified clean on your screen): 240x160 @ 20 fps smooth
[env:esp32s3_20mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=20000000

; Faster video, only if the picture stays clean
[env:esp32s3_27mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=27000000

[env:esp32s3_40mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=40000000

; Use if the blue header bar shows at the BOTTOM (mirrored)
[env:esp32s3_flip]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=20000000
    -DDISPLAY_FLIP_Y

; Experimental 80 MHz for 480x272@20 / 480x320@18 presets
[env:esp32s3_80mhz]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=80000000

; Page drawing now goes to a PSRAM sprite and is sent as one bulk transfer (more robust than many tiny SPI writes).
; ---------- COLOUR fixes (use only if photos/colours look wrong) ----------
; red and blue swapped:
[env:color_bgr]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=20000000
    -DDISP_RGB_ORDER=1

; colours look inverted (negative):
[env:color_invert]
build_flags =
    ${env.build_flags}
    -DDISP_SPI_HZ=20000000
    -DDISP_INVERT=1
